<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <!-- السطر ده لضمان استجابة الصفحة بالملّي على الموبايل -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>نسيت كلمة المرور | العلم والإيمان</title>
  
  <!-- الخط ومكتبة سوبابيز -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --green-1: #0a3d1f; --green-2: #145a32; --green-3: #1e8449; --green-4: #27ae60; --green-5: #a9dfbf;
      --white: #ffffff; --off-white: #f4faf6; --text-dark: #0a3d1f; --shadow-green: rgba(10,61,31,0.25);
    }
    
    body { 
      font-family: 'Tajawal', sans-serif; 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      background: var(--green-1); 
      padding: 15px; /* مساحة أمان ممتازة للموبايل */
      position: relative; 
      overflow-x: hidden; 
    }
    
    .bg-circle { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
    .bg-circle-1 { width: 300px; height: 300px; top: -100px; left: -100px; background: radial-gradient(circle, rgba(39,174,96,0.15) 0%, transparent 70%); }
    .bg-circle-2 { width: 300px; height: 300px; bottom: -100px; right: -100px; background: radial-gradient(circle, rgba(30,132,73,0.15) 0%, transparent 70%); }
    
    .card { 
      position: relative; 
      z-index: 1; 
      background: var(--white); 
      border-radius: 24px; 
      width: 100%; 
      max-width: 430px; /* حجم مثالي ومريح للعين على الديسكتوب والموبايل */
      box-shadow: 0 30px 60px var(--shadow-green); 
      overflow: hidden; 
      animation: popUp 0.4s ease both; 
    }
    
    @keyframes popUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    .top-bar { height: 5px; background: linear-gradient(90deg, var(--green-1), var(--green-4), var(--green-1)); }
    
    .card-header { background: linear-gradient(145deg, var(--green-1) 0%, var(--green-2) 100%); padding: 25px 20px; text-align: center; }
    .logo-ring { width: 65px; height: 65px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 28px; }
    .card-header h1 { font-size: 19px; font-weight: 800; color: var(--white); }
    
    .card-body { padding: 30px 25px; }
    .page-title { text-align: center; margin-bottom: 20px; }
    .page-title h2 { font-size: 18px; font-weight: 800; color: var(--text-dark); margin-bottom: 6px; }
    .page-title p { font-size: 13px; color: #6b8f79; line-height: 1.4; }
    
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text-dark); margin-bottom: 8px; }
    
    .input-wrap { position: relative; }
    .input-wrap .ico { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; color: #b0c8bb; }
    
    .input-wrap input { 
      width: 100%; 
      padding: 14px 45px 14px 16px; 
      border: 2px solid #dceee4; 
      border-radius: 12px; 
      font-size: 15px; 
      direction: ltr; 
      text-align: right; 
      background: var(--off-white); 
      outline: none; 
      transition: all 0.25s; 
      -webkit-appearance: none; /* لمنع مشاكل حواف المدخلات في أجهزة الآيفون */
    }
    .input-wrap input:focus { border-color: var(--green-4); background: var(--white); box-shadow: 0 0 0 4px rgba(39,174,96,0.1); }
    
    .err-msg { color: #c0392b; font-size: 13px; margin-top: 8px; display: none; line-height: 1.4; padding: 8px 12px; background: #fdf2f2; border-radius: 8px; border-right: 3px solid #c0392b; }
    
    .btn-send { 
      width: 100%; 
      padding: 14px; 
      background: linear-gradient(135deg, var(--green-2), var(--green-4)); 
      color: var(--white); 
      border: none; 
      border-radius: 12px; 
      font-size: 15px; 
      font-weight: 800; 
      cursor: pointer; 
      transition: transform 0.2s, opacity 0.2s; 
      box-shadow: 0 5px 15px rgba(30,132,73,0.3); 
      -webkit-tap-highlight-color: transparent; /* يمنع الوميض الأزرق عند الضغط في الموبايل */
    }
    .btn-send:active { transform: scale(0.98); }
    .btn-send:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    
    .success-box { display: none; text-align: center; padding: 20px; background: #e8f8ef; border: 1.5px solid rgba(39,174,96,0.3); border-radius: 16px; margin-top: 10px; }
    .success-box h3 { font-size: 16px; color: var(--text-dark); margin-bottom: 5px; }
    .success-box p { font-size: 13px; color: #2c7a4b; line-height: 1.4; }
    
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0 12px; color: #c5ddd0; font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e4f0e8; }
    
    .back-link { text-align: center; font-size: 13px; }
    .back-link a { color: var(--green-3); text-decoration: none; font-weight: 700; padding: 5px; display: inline-block; }
    
    /* تحسينات إضافية مخصصة للشاشات الصغيرة جداً (مثل iPhone SE) */
    @media (max-width: 360px) {
      body { padding: 10px; }
      .card-body { padding: 20px 15px; }
      .card-header { padding: 25px 15px; }
    }
  </style>
</head>
<body>

  <div class="bg-circle bg-circle-1"></div>
  <div class="bg-circle bg-circle-2"></div>

  <div class="card">
    <div class="top-bar"></div>
    <div class="card-header">
      <div class="logo-ring">📚</div>
      <h1>العلم والإيمان</h1>
    </div>

    <div class="card-body">
      <div class="page-title">
        <h2>🔐 نسيت كلمة المرور؟</h2>
        <p>أدخل بريدك الإلكتروني لإرسال رابط الاستعادة</p>
      </div>

      <form id="resetForm" novalidate>
        <div class="form-group">
          <label for="emailInput">البريد الإلكتروني</label>
          <div class="input-wrap">
            <input type="email" id="emailInput" placeholder="example@email.com" required />
            <span class="ico">✉️</span>
          </div>
          <div class="err-msg" id="emailError">⚠️ الرجاء إدخال بريد إلكتروني صحيح</div>
        </div>
        <button type="submit" class="btn-send" id="submitBtn">إرسال رابط الاستعادة</button>
      </form>

      <div class="success-box" id="successBox">
        <span style="font-size: 24px;">✅</span>
        <h3>تم الإرسال بنجاح!</h3>
        <p>إذا كان هذا البريد مسجلاً لدينا، سيصل رابط إلى البريد. تفقد صندوق الوارد والبريد العشوائي.</p>
      </div>

      <div class="divider">أو</div>
      <div class="back-link"><a href="auth.html">← العودة لتسجيل الدخول</a></div>
    </div>
  </div>

  <script>
    // بيانات المشروع والربط
    const SUPABASE_URL = "https://equefefnimfaqkyckbep.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxdWVmZWZuaW1mYXFreWNrYmVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMTczOTcsImV4cCI6MjA5Nzg5MzM5N30.CniHMjUSvB2dLlZ9ykBiiLRa9KsATBsJj6S7uldZbwk";
    
    // استخدام اسم متغير فريد منعاً لأي تضارب برمي
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form       = document.getElementById('resetForm');
    const emailInp   = document.getElementById('emailInput');
    const emailError = document.getElementById('emailError');
    const submitBtn  = document.getElementById('submitBtn');
    const successBox = document.getElementById('successBox');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // الفلترة والتحقق من صحة الإيميل
      const emailValue = emailInp.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailValue)) {
        emailError.textContent = '⚠️ الرجاء إدخال بريد إلكتروني صحيح';
        emailError.style.display = 'block';
        return;
      }
      
      emailError.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = '⏳ جاري الإرسال...';

      // رابط صفحة التحديث التلقائي
      const updatePasswordUrl = window.location.origin && window.location.origin !== 'null'
        ? `${window.location.origin}${window.location.pathname.replace(/\/ ?forget-password\.html$/, '/update-password.html')}`
        : '';

      if (!updatePasswordUrl) {
        emailError.textContent = '❌ لا يمكن إنشاء رابط الاستعادة من صفحة محلية. افتح الصفحة عبر http أو https.';
        emailError.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'إرسال رابط الاستعادة';
        return;
      }

      try {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(emailValue, {
          redirectTo: updatePasswordUrl,
        });

        if (error) throw error;

        // نجاح العملية
        form.style.display = 'none';
        successBox.style.display = 'block';
      } catch (err) {
        // فك تشفير الخطأ وإظهاره بوضوح تام مهما كان نوعه بدل الأقواس الفارغة
        console.error("Supabase Error Details:", err);
        emailError.textContent = '❌ خطأ: ' + (err.error_description || err.message || JSON.stringify(err));
        emailError.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'إرسال رابط الاستعادة';
      }
    });
  </script>
</body>
</html>
