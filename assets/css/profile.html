<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>الملف الشخصي للطالب - منصة الأستاذ مجدي الشافعي</title>
    
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- مكتبات التصميم والأيقونات -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- مكتبة سوبابيز (Supabase) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- خط تاجوال -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Tajawal', sans-serif; touch-action: manipulation; }

        /* لودر التحميل */
        .loader {
            border: 3.5px solid #e2e8f0;
            border-top: 3.5px solid #2563eb;
            border-radius: 50%;
            width: 44px; height: 44px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* الإشعارات */
        .toast {
            position: fixed; top: 1rem; left: 50%; transform: translateX(-50%) translateY(-20px);
            z-index: 999; display: flex; align-items: center; gap: 0.75rem;
            max-width: 26rem; width: calc(100% - 2rem); padding: 0.875rem 1.25rem;
            border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.12);
            color: #fff; backdrop-filter: blur(12px); opacity: 0; pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .toast.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
        .toast-icon-wrapper {
            width: 2.25rem; height: 2.25rem; display: grid; place-items: center;
            border-radius: 0.625rem; background: rgba(255, 255, 255, 0.2); flex-shrink: 0;
        }
        
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
        @media screen and (max-width: 768px) {
            input, select { font-size: 16px !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased pb-12 min-h-screen">

    <!-- شاشة التحميل الافتتاحية -->
    <div id="page-loader" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-4 transition-opacity duration-300">
        <div id="loader-spinner-container" class="flex flex-col items-center text-center">
            <div class="loader mb-4"></div>
            <p class="text-slate-600 font-medium text-base md:text-lg animate-pulse">جاري جلب بياناتك من المنصة...</p>
        </div>

        <!-- صندوق الخطأ -->
        <div id="loader-error-box" class="hidden text-center max-w-sm w-full bg-red-50 border border-red-200 p-6 rounded-2xl shadow-sm">
            <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-3">
                <i data-lucide="wifi-off" class="w-6 h-6"></i>
            </div>
            <h3 class="font-bold text-red-900 mb-1">تأخرت الاستجابة</h3>
            <p id="error-msg" class="text-slate-600 text-sm mb-4">يرجى التأكد من اتصالك بالإنترنت.</p>
            <button onclick="location.reload()" class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-2.5 rounded-xl transition-all shadow-md active:scale-95">
                تحديث الصفحة
            </button>
        </div>
    </div>

    <!-- إشعارات -->
    <div id="toast" class="toast bg-slate-800">
        <div class="toast-icon-wrapper"><i id="toast-icon" data-lucide="info"></i></div>
        <span id="toast-message" class="flex-1 font-medium text-sm"></span>
    </div>

    <!-- شريط التنقل -->
    <nav class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40 w-full shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 md:w-10 md:h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center shadow-md shadow-blue-600/20">
                    <i data-lucide="graduation-cap" class="w-5 h-5"></i>
                </div>
                <span class="font-bold text-lg md:text-xl text-slate-800 hidden sm:block">منصة الأستاذ مجدي الشافعي</span>
                <span class="font-bold text-base text-slate-800 sm:hidden">المنصة</span>
            </div>
            <a href="index.html" class="flex items-center gap-1.5 px-3.5 py-2 bg-slate-100 hover:bg-blue-50 hover:text-blue-700 text-slate-700 rounded-xl transition-all text-sm font-medium border border-slate-200/80">
                <i data-lucide="home" class="w-4 h-4"></i>
                <span>الرئيسية</span>
            </a>
        </div>
    </nav>

    <!-- المحتوى -->
    <main class="max-w-4xl mx-auto px-4 mt-6 md:mt-10">
        
        <!-- كارت الترحيب -->
        <div class="bg-white rounded-2xl md:rounded-3xl p-5 md:p-8 shadow-sm border border-slate-200 flex flex-col md:flex-row items-center gap-5 md:gap-6 mb-6 relative overflow-hidden">
            <div class="absolute -right-20 -top-20 w-64 h-64 bg-blue-50/60 rounded-full blur-3xl pointer-events-none"></div>

            <div class="relative z-10 flex-shrink-0">
                <img id="profile-img" src="" alt="الصورة" class="w-24 h-24 md:w-32 md:h-32 rounded-2xl object-cover border-4 border-white shadow-md bg-slate-100">
            </div>
            
            <div class="text-center md:text-right flex-1 z-10 w-full">
                <h1 id="display-name" class="text-xl md:text-3xl font-bold text-slate-900 mb-2">جاري التحميل...</h1>
                <div class="flex flex-wrap items-center justify-center md:justify-start gap-2 text-xs md:text-sm">
                    <span class="bg-blue-50 text-blue-700 border border-blue-100 px-3 py-1.5 rounded-xl font-medium flex items-center gap-1.5" id="display-stage">
                        <i data-lucide="book-open" class="w-3.5 h-3.5"></i> <span>المرحلة الدراسية</span>
                    </span>
                    <span class="bg-slate-100 text-slate-700 border border-slate-200 px-3 py-1.5 rounded-xl font-mono flex items-center gap-1.5" id="display-code">
                        <i data-lucide="hash" class="w-3.5 h-3.5 text-slate-400"></i> <span>كود الطالب</span>
                    </span>
                </div>
            </div>

            <div id="edit-btn-container" class="w-full md:w-auto z-10 mt-2 md:mt-0">
                <button onclick="toggleEditMode(true)" class="w-full md:w-auto bg-slate-900 hover:bg-blue-600 text-white px-5 py-2.5 md:py-3 rounded-xl font-medium transition-all duration-200 flex items-center justify-center gap-2 shadow-sm text-sm md:text-base">
                    <i data-lucide="edit-3" class="w-4 h-4"></i> تحديث البيانات
                </button>
            </div>
        </div>

        <!-- كارت البيانات -->
        <div class="bg-white rounded-2xl md:rounded-3xl p-5 md:p-8 shadow-sm border border-slate-200 relative">
            <div class="flex items-center gap-2.5 mb-6 pb-4 border-b border-slate-100">
                <div class="p-2 bg-blue-50 rounded-lg text-blue-600">
                    <i data-lucide="user" class="w-5 h-5"></i>
                </div>
                <h2 class="text-lg md:text-xl font-bold text-slate-900">البيانات الأساسية</h2>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-6">
                <div>
                    <label class="block text-xs md:text-sm font-bold text-slate-700 mb-1.5">اسم الطالب بالكامل</label>
                    <input type="text" id="input-full-name" disabled class="form-input w-full px-3.5 py-2.5 md:py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all disabled:opacity-75 disabled:cursor-not-allowed">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs md:text-sm font-bold text-slate-700">البريد الإلكتروني</label>
                        <i data-lucide="lock" class="w-3.5 h-3.5 text-slate-400"></i>
                    </div>
                    <input type="email" id="input-email" disabled class="w-full px-3.5 py-2.5 md:py-3 rounded-xl border border-slate-200 bg-slate-100/60 text-slate-500 cursor-not-allowed focus:outline-none text-left" dir="ltr">
                </div>

                <div>
                    <label class="block text-xs md:text-sm font-bold text-slate-700 mb-1.5">رقم هاتف الطالب (واتساب)</label>
                    <input type="tel" id="input-student-phone" disabled class="form-input w-full px-3.5 py-2.5 md:py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all disabled:opacity-75 disabled:cursor-not-allowed text-left" dir="ltr">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs md:text-sm font-bold text-slate-700">رقم هاتف ولي الأمر</label>
                        <span class="text-[10px] md:text-[11px] text-amber-600 bg-amber-50 px-2 py-0.5 rounded border border-amber-200 flex items-center gap-1"><i data-lucide="shield-alert" class="w-3 h-3"></i> محمي بـ RLS</span>
                    </div>
                    <input type="tel" id="input-parent-phone" disabled class="w-full px-3.5 py-2.5 md:py-3 rounded-xl border border-slate-200 bg-slate-100/60 text-slate-500 cursor-not-allowed focus:outline-none text-left" dir="ltr">
                </div>

                <div class="relative">
                    <label class="block text-xs md:text-sm font-bold text-slate-700 mb-1.5">المرحلة الدراسية</label>
                    <div class="relative">
                        <select id="input-stage" disabled class="form-input w-full pl-10 pr-3.5 py-2.5 md:py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all disabled:opacity-75 disabled:cursor-not-allowed">
                            <option value="" disabled selected>اختر المرحلة...</option>
                            <optgroup label="المرحلة الإعدادية">
                                <option value="الصف الأول الإعدادي">الصف الأول الإعدادي</option>
                                <option value="الصف الثاني الإعدادي">الصف الثاني الإعدادي</option>
                                <option value="الصف الثالث الإعدادي">الصف الثالث الإعدادي</option>
                            </optgroup>
                            <optgroup label="المرحلة الثانوية">
                                <option value="الصف الأول الثانوي">الصف الأول الثانوي</option>
                                <option value="الصف الثاني الثانوي">الصف الثاني الثانوي</option>
                                <option value="الصف الثالث الثانوي">الصف الثالث الثانوي</option>
                            </optgroup>
                        </select>
                        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                            <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs md:text-sm font-bold text-slate-700">كود المنصة</label>
                        <span class="text-[10px] md:text-[11px] text-blue-600 bg-blue-50 px-2 py-0.5 rounded border border-blue-200">فريد ومحمي</span>
                    </div>
                    <input type="text" id="input-student-code" disabled class="w-full px-3.5 py-2.5 md:py-3 rounded-xl border border-slate-200 bg-slate-100/60 text-slate-500 font-mono cursor-not-allowed focus:outline-none">
                </div>
            </div>

            <!-- أزرار التحكم -->
            <div id="action-buttons" class="hidden flex-col-reverse sm:flex-row items-center justify-end gap-3 pt-6 mt-6 border-t border-slate-100">
                <button onclick="cancelEdit()" class="w-full sm:w-auto px-5 py-2.5 rounded-xl font-medium text-slate-600 hover:bg-slate-100 transition-all text-center text-sm md:text-base">
                    إلغاء
                </button>
                <button id="save-btn" onclick="saveData()" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 active:scale-95 text-white px-7 py-2.5 md:py-3 rounded-xl font-medium transition-all flex items-center justify-center gap-2 shadow-md shadow-blue-600/20 text-sm md:text-base">
                    <i data-lucide="save" class="w-4 h-4"></i>
                    <span id="save-btn-text">حفظ التغييرات</span>
                </button>
            </div>

        </div>
    </main>

    <!-- يجب وضع الكود البرمجي في نهاية الـ body لتجنب التوقف أثناء بناء الصفحة -->
    <script>
        // إعداد المتغيرات الرئيسية
        const SUPABASE_URL = 'https://equefefnimfaqkyckbep.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxdWVmZWZuaW1mYXFreWNrYmVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMTczOTcsImV4cCI6MjA5Nzg5MzM5N30.CniHMjUSvB2dLlZ9ykBiiLRa9KsATBsJj6S7uldZbwk';
        
        let supabaseClient = null;
        let currentUserData = null;
        let originalInputs = {};

        // 1. تفعيل الأيقونات برمجياً بأمان
        function renderIcons() {
            try { if (typeof lucide !== 'undefined') lucide.createIcons(); } 
            catch(e) { console.error("Lucide Error", e); }
        }

        // 2. دوال التحكم باللودر (إخفاء / خطأ)
        function forceHideLoader() {
            const loader = document.getElementById('page-loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.pointerEvents = 'none';
                setTimeout(() => loader.style.display = 'none', 300);
            }
        }

        function showFatalError(msg) {
            document.getElementById('loader-spinner-container').style.display = 'none';
            document.getElementById('loader-error-box').classList.remove('hidden');
            if (msg) document.getElementById('error-msg').innerText = msg;
        }

        // 3. الدالة الرئيسية للتشغيل (تعمل فور تحميل الصفحة بالكامل)
        async function bootApplication() {
            renderIcons();

            // قاطع الأمان: بعد 4.5 ثوانٍ يتم إخفاء اللودر إجبارياً مهما حدث لمنع التعليق
            const fallbackTimer = setTimeout(() => {
                forceHideLoader();
                fillUIData(null, null);
                showToast("حدث بطء في الاتصال، نعرض النسخة المخبأة", "clock", "bg-slate-700");
            }, 4500);

            try {
                if (!window.supabase) throw new Error("تعذر الوصول لشبكة الخوادم (CDN)");
                
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                // استخدام getSession لأنها تعتمد على التخزين المحلي أولاً ولا تعلق الصفحة
                const { data: authData, error: authError } = await supabaseClient.auth.getSession();
                if (authError) throw authError;

                const user = authData?.session?.user;
                if (!user) {
                    clearTimeout(fallbackTimer);
                    forceHideLoader();
                    fillUIData(null, null);
                    showToast("يرجى تسجيل الدخول للوصول لبياناتك", "log-in", "bg-amber-600");
                    return;
                }

                currentUserData = user;

                // استدعاء بيانات جدول profiles مع مطابقة الحقول التي تفضلت بذكرها
                const { data: profileRow, error: dbError } = await supabaseClient
                    .from('profiles')
                    .select('id, full_name, student_phone, parent_phone, stage, student_code, email')
                    .eq('id', user.id)
                    .single();

                if (dbError && dbError.code !== 'PGRST116') throw dbError;

                clearTimeout(fallbackTimer);
                forceHideLoader();
                fillUIData(profileRow, user);

            } catch (err) {
                clearTimeout(fallbackTimer);
                console.error(err);
                showFatalError(err.message || "فشل مزامنة البيانات، يرجى المحاولة لاحقاً.");
            }
        }

        // 4. تعبئة البيانات في الشاشة
        function fillUIData(profile, userObj) {
            const fullName = profile?.full_name || "طالب بدون اسم";
            // استخدم الإيميل من جدول profiles إن وجد، أو من الـ Auth User
            const email = profile?.email || userObj?.email || "";
            const studentPhone = profile?.student_phone || "";
            const parentPhone = profile?.parent_phone || "";
            const stage = profile?.stage || "";
            const studentCode = profile?.student_code || "";
            
            const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(fullName)}&background=eff6ff&color=2563eb&size=150&font-size=0.4&bold=true`;

            // العناوين العلوية
            document.getElementById('display-name').innerText = fullName;
            document.getElementById('display-stage').querySelector('span').innerText = stage || "لم يتم تحديد مرحلة";
            document.getElementById('display-code').querySelector('span').innerText = studentCode ? `كود: ${studentCode}` : "لا يوجد كود";
            document.getElementById('profile-img').src = avatarUrl;

            // الحقول
            document.getElementById('input-full-name').value = fullName;
            document.getElementById('input-email').value = email;
            document.getElementById('input-student-phone').value = studentPhone;
            document.getElementById('input-parent-phone').value = parentPhone;
            document.getElementById('input-student-code').value = studentCode;
            
            // ضبط قائمة الاختيار
            const selectEl = document.getElementById('input-stage');
            if (selectEl) {
                const optExists = Array.from(selectEl.options).some(o => o.value === stage);
                selectEl.value = optExists ? stage : "";
            }
        }

        // 5. التحكم بوضع التعديل
        function toggleEditMode(state) {
            const editableInputs = document.querySelectorAll('.form-input');
            const btnsBox = document.getElementById('action-buttons');
            const editBtnBox = document.getElementById('edit-btn-container');

            if (state) {
                // حفظ النسخة الحالية للتراجع
                originalInputs = {
                    name: document.getElementById('input-full-name').value,
                    phone: document.getElementById('input-student-phone').value,
                    stage: document.getElementById('input-stage').value
                };
                
                editableInputs.forEach(el => {
                    el.removeAttribute('disabled');
                    el.classList.replace('bg-slate-50', 'bg-white');
                });
                btnsBox.classList.replace('hidden', 'flex');
                editBtnBox.classList.add('hidden');
            } else {
                editableInputs.forEach(el => {
                    el.setAttribute('disabled', 'true');
                    el.classList.replace('bg-white', 'bg-slate-50');
                });
                btnsBox.classList.replace('flex', 'hidden');
                editBtnBox.classList.remove('hidden');
            }
        }

        function cancelEdit() {
            document.getElementById('input-full-name').value = originalInputs.name;
            document.getElementById('input-student-phone').value = originalInputs.phone;
            document.getElementById('input-stage').value = originalInputs.stage;
            toggleEditMode(false);
        }

        // 6. حفظ البيانات بقاعدة البيانات (متوافق 100% مع سياسة RLS المذكورة)
        async function saveData() {
            if (!supabaseClient || !currentUserData) return showToast("قم بتسجيل الدخول أولاً", "x-circle", "bg-red-600");

            const btn = document.getElementById('save-btn');
            const btnText = document.getElementById('save-btn-text');
            btn.disabled = true; btnText.innerText = "جاري الحفظ...";

            const newName = document.getElementById('input-full-name').value.trim();
            const newPhone = document.getElementById('input-student-phone').value.trim();
            const newStage = document.getElementById('input-stage').value;

            try {
                // نحدث الحقول المسموحة فقط لتجاوز سياسة المنع RLS "منع الطلاب من تعديل كود الطالب ورق"
                const { error } = await supabaseClient
                    .from('profiles')
                    .update({
                        full_name: newName,
                        student_phone: newPhone,
                        stage: newStage
                    })
                    .eq('id', currentUserData.id);

                if (error) throw error;

                // تحديث الواجهة فوراً
                document.getElementById('display-name').innerText = newName;
                document.getElementById('display-stage').querySelector('span').innerText = newStage || "بدون مرحلة";
                document.getElementById('profile-img').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(newName)}&background=eff6ff&color=2563eb&size=150&font-size=0.4&bold=true`;
                
                toggleEditMode(false);
                showToast("تم الحفظ بنجاح", "check-circle", "bg-green-600");

            } catch (err) {
                console.error("Save Error:", err);
                showToast("خطأ أثناء الحفظ! راجع الاتصال", "alert-triangle", "bg-red-600");
            } finally {
                btn.disabled = false; btnText.innerText = "حفظ التغييرات";
            }
        }

        // 7. عرض الإشعارات
        let toastTimer;
        function showToast(msg, icon, bgClass) {
            const t = document.getElementById('toast');
            t.className = `toast ${bgClass}`;
            document.getElementById('toast-message').innerText = msg;
            document.getElementById('toast-icon').setAttribute('data-lucide', icon);
            renderIcons();
            
            requestAnimationFrame(() => t.classList.add('show'));
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
        }

        // إطلاق السكربت عند انتهاء تحميل المتصفح
        window.addEventListener('load', bootApplication);
    </script>
</body>
</html>
